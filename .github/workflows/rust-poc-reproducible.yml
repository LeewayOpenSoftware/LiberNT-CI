# Reproducible-build + static-safety gate for the experimental Rust kernel-driver PoC.
# Runs on push to leeway/exp-rust-poc (and manual dispatch). Builds ONLY the Rust
# staticlib (no kernel link): it never enables LIBERNT_ENABLE_RUST for the OS build
# and never touches the ISO.
name: rust-poc-reproducible

on:
  push:
    branches: [leeway/exp-rust-poc]
    paths:
      - 'tools/rust-poc/**'
      - '.github/workflows/rust-poc-reproducible.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reproducible-staticlib:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/rust-poc
    steps:
      - uses: actions/checkout@v4

      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install nightly-2026-05-24 --profile minimal \
            --component rust-src --component llvm-tools
          rustup override set nightly-2026-05-24
          rustc --version --verbose

      - name: Build twice (default config)
        run: |
          CARGO_TARGET_DIR="$RUNNER_TEMP/b1" cargo build --release --locked
          CARGO_TARGET_DIR="$RUNNER_TEMP/b2" cargo build --release --locked

      - name: Reproducibility gate (sha256 must match)
        run: |
          L=x86_64-unknown-libernt-kernel/release/libleeway_rs_poc.a
          H1=$(sha256sum "$RUNNER_TEMP/b1/$L" | awk '{print $1}')
          H2=$(sha256sum "$RUNNER_TEMP/b2/$L" | awk '{print $1}')
          echo "build1 sha256 = $H1"
          echo "build2 sha256 = $H2"
          if [ "$H1" != "$H2" ]; then echo "::error::staticlib not reproducible"; exit 1; fi
          echo "reproducible sha256 = $H1"
          echo "RUST_POC_SHA256=$H1" >> "$GITHUB_ENV"

      - name: Locate llvm tools
        run: |
          echo "LLVM_BIN=$(dirname $(find $(rustc --print sysroot) -name llvm-nm | head -1))" >> "$GITHUB_ENV"

      - name: "Static safety checks (default build: sanctioned externs only, no bugcheck)"
        run: |
          # The v2 allocator + spin lock legitimately import ntoskrnl pool/spin-lock
          # routines, so the default build is no longer extern-free. The real safety
          # property is: externs are a subset of a sanctioned Ex*/Ke* allowlist, and
          # KeBugCheckEx is ABSENT (LTO proves no panic is reachable on normal op).
          L="$RUNNER_TEMP/b1/x86_64-unknown-libernt-kernel/release/libleeway_rs_poc.a"
          D="$RUNNER_TEMP/x1"; rm -rf "$D"; mkdir -p "$D"; ( cd "$D"
            for OBJ in $("$LLVM_BIN/llvm-ar" t "$L" | grep -i leeway); do "$LLVM_BIN/llvm-ar" x "$L" "$OBJ"; done )
          U=$("$LLVM_BIN/llvm-nm" "$D"/*.o 2>/dev/null | grep ' U ' | awk '{print $NF}' | sort -u)
          echo "== undefined externs (default) =="; echo "${U:-<none>}"
          ALLOW="ExAllocatePoolWithTag ExFreePoolWithTag KeInitializeSpinLock KeAcquireSpinLockRaiseToDpc KeReleaseSpinLock"
          for s in $U; do
            case " $ALLOW " in *" $s "*) ;; *) echo "::error::unexpected extern in default build: $s"; exit 1;; esac
          done
          if printf '%s\n' $U | grep -qx 'KeBugCheckEx'; then
            echo "::error::KeBugCheckEx reachable in default build (bugcheck must be absent on normal op)"; exit 1; fi
          echo "== opcode scan: forbidden x87/MMX/AVX =="
          "$LLVM_BIN/llvm-objdump" -d "$D"/*.o > dis.txt
          if grep -iwE 'fld|fstp|fadd|fmul|fdiv|emms|femms' dis.txt; then echo "::error::x87/MMX found"; exit 1; fi
          if grep -iE '%ymm|%zmm|vzeroupper' dis.txt; then echo "::error::AVX found"; exit 1; fi
          echo "default build clean (externs sanctioned, no bugcheck, no FP)"

      - name: "Static checks (test-ioctls build: sanctioned externs + KeBugCheckEx)"
        run: |
          CARGO_TARGET_DIR="$RUNNER_TEMP/bp" cargo build --release --locked --features test-ioctls
          L="$RUNNER_TEMP/bp/x86_64-unknown-libernt-kernel/release/libleeway_rs_poc.a"
          D="$RUNNER_TEMP/xp"; rm -rf "$D"; mkdir -p "$D"; ( cd "$D"
            for OBJ in $("$LLVM_BIN/llvm-ar" t "$L" | grep -i leeway); do "$LLVM_BIN/llvm-ar" x "$L" "$OBJ"; done )
          U=$("$LLVM_BIN/llvm-nm" "$D"/*.o 2>/dev/null | grep ' U ' | awk '{print $NF}' | sort -u)
          echo "== undefined externs (test build) =="; echo "$U"
          # test-ioctls adds exactly the gated bugcheck path on top of the sanctioned set.
          ALLOW="ExAllocatePoolWithTag ExFreePoolWithTag KeInitializeSpinLock KeAcquireSpinLockRaiseToDpc KeReleaseSpinLock KeBugCheckEx"
          for s in $U; do
            case " $ALLOW " in *" $s "*) ;; *) echo "::error::unexpected extern in test build: $s"; exit 1;; esac
          done
          if ! printf '%s\n' $U | grep -qx 'KeBugCheckEx'; then
            echo "::error::test build must reference KeBugCheckEx (the gated bugcheck path)"; exit 1; fi
          echo "test build extern surface OK (sanctioned + KeBugCheckEx)"

      - name: Upload staticlib
        uses: actions/upload-artifact@v4
        with:
          name: lnrspoc-staticlib-${{ env.RUST_POC_SHA256 }}
          path: ${{ runner.temp }}/b1/x86_64-unknown-libernt-kernel/release/libleeway_rs_poc.a
          if-no-files-found: error

  io3-differential:
    # D-1: the IO-3 name-grafting validator (same source) vs an independent C reference,
    # over a corpus + a structured sweep + a deterministic fuzz. Exit 0 iff 0 disagreements
    # and every status class was produced (non-vacuous). Host-side only; no kernel link.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install nightly-2026-05-24 --profile minimal --component rust-src
          rustc +nightly-2026-05-24 --version --verbose
      - name: Run D-1 differential (2,000,000 fuzz iterations)
        run: |
          chmod +x tools/rust-poc/difftest/run-differential.sh
          ITERS=2000000 tools/rust-poc/difftest/run-differential.sh

  io3-equivalence:
    # Production-equivalence: the SAME Rust source, linked into Stanley's shipped harness as
    # IopValidateMountPointBuffer, agrees with his Oracle() + fixed cases + generator, and the
    # C baseline (reparse.c == Oracle) also passes. The harness is pinned to the public
    # LiberNT-CI SHA; the job fails if EITHER side (the Rust or the pinned C/harness) changes.
    runs-on: ubuntu-latest
    env:
      IO3_SHA: 1d45eab8da4251cce466d3b2fc4b8e335507bc96
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust toolchain
        run: rustup toolchain install nightly-2026-05-24 --profile minimal --component rust-src
      - name: Fetch the io3 harness at the pinned SHA (public LiberNT-CI)
        run: |
          mkdir -p "$RUNNER_TEMP/ci" && cd "$RUNNER_TEMP/ci" && git init -q
          git remote add origin https://github.com/LeewayOpenSoftware/LiberNT-CI.git
          # Fetch the exact immutable commit id, so a moved/merged/deleted branch cannot
          # change what we test (the pin cannot drift).
          git fetch --depth 1 origin "$IO3_SHA"
          git checkout -q "$IO3_SHA"
      - name: Run the production-equivalence harness (C baseline + Rust)
        run: |
          chmod +x tools/rust-poc/difftest/run-io3-harness.sh
          IOMGR="$RUNNER_TEMP/ci/submodules/host-tests/iomgr" ITERS=2000000 \
            tools/rust-poc/difftest/run-io3-harness.sh

  mp-equivalence:
    # R1c: the Rust mapping-pairs decoder linked into the ntfslib decoder rig as its
    # alternative implementation. The library (reference), the spec model and the Rust
    # port must agree on status and on every run for the harvested corpus and for
    # generated input over three seeds, under ASan and UBSan. The rig is pinned to a
    # full SHA of the public LiberNT-CI; agreement on these inputs, not proof.
    runs-on: ubuntu-24.04
    env:
      RIG_SHA: 6a77c230b234f2e9a2a762964439cf8a7e46b01f
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust toolchain and host build tools
        run: |
          rustup toolchain install nightly-2026-05-24 --profile minimal
          sudo apt-get update
          sudo apt-get install -y g++ cmake ninja-build pkg-config libfuse3-dev
      - name: Fetch the decoder rig at the pinned SHA (public LiberNT-CI)
        run: |
          mkdir -p "$RUNNER_TEMP/rig" && cd "$RUNNER_TEMP/rig" && git init -q
          git remote add origin https://github.com/LeewayOpenSoftware/LiberNT-CI.git
          git sparse-checkout set sdk/lib/fslib/ntfslib_new base/applications/cmdutils/lntexpandstorage
          git fetch -q --depth 1 --filter=blob:none origin "$RIG_SHA"
          git checkout -q FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$RIG_SHA"
      - name: Run the rig (ntfslib == model == rust)
        env:
          ASAN_OPTIONS: detect_leaks=1:abort_on_error=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: |
          RIG="$RUNNER_TEMP/rig" ITERS=1000000 sh tools/rust-poc/ntfs-decode-rs/difftest/run-mp-rig.sh
