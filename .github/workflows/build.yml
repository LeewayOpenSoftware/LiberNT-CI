name: Build
on:
  push:
    branches-ignore: [main-nt10]
  pull_request:
  # Manual restart for a branch whose push event was lost (GitHub incident of 2026-11-12).
  # lrm_rs=true builds instead an experimental image with LIBERNT_ENABLE_RUST and
  # LIBERNT_ENABLE_LRM_RS ON (special pool routed through Rust) plus lnrspoc.sys, for VM
  # tests only: build-linux only, artifact names carry -lrmrs, no LBI allocation, no ccache save.
  workflow_dispatch:
    inputs:
      lrm_rs:
        description: 'LRM-RS special pool: default (ON on amd64) | on (also build the lnrspoc PoC lab image) | off (flag-OFF control build)'
        type: choice
        options:
          - default
          - 'on'
          - 'off'
        default: default
      force_panic:
        description: 'LAB-ONLY LRM-RS force-panic image (implies the lnrspoc PoC + FORCE_PANIC_TEST + LNRSPOC_TEST_IOCTLS, FORBID_PANIC off, lnrspoc 0x80B); disposable VM only, never ship'
        type: boolean
        default: false
      msvc:
        description: 'Also run build-msvc (MSVC + Rust leg and C-only leg, with bootcd.iso artifacts)'
        type: boolean
        default: false

concurrency:
  group: build-${{ github.ref }}-${{ (github.event_name == 'workflow_dispatch' && inputs.force_panic) && 'lrmrsfp' || (github.event_name == 'workflow_dispatch' && inputs.lrm_rs == 'on') && 'lrmpoc' || (github.event_name == 'workflow_dispatch' && inputs.lrm_rs == 'off') && 'lrmoff' || 'std' }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: write

jobs:
  build-linux:
    strategy:
      matrix:
        include:
          - compiler: clang
            arch: amd64
      fail-fast: false
    runs-on: ubuntu-24.04
    env:
      # LRM-RS special pool is the amd64 default (owner order 2026-11-14). ON unless an explicit opt-out.
      LRM_RS: ${{ (github.event_name == 'workflow_dispatch' && inputs.lrm_rs == 'off' && !inputs.force_panic) && 'OFF' || 'ON' }}
      # The opt-in lnrspoc PoC (ENABLE_RUST umbrella) is built only for lab images that need the usermode driver.
      LAB_POC: ${{ (github.event_name == 'workflow_dispatch' && (inputs.lrm_rs == 'on' || inputs.force_panic)) && 'ON' || 'OFF' }}
      FORCE_PANIC: ${{ (github.event_name == 'workflow_dispatch' && inputs.force_panic) && 'ON' || 'OFF' }}
    steps:
    - name: Free disk space
      run: |
        df -h /
        sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/share/swift /usr/lib/jvm /usr/local/share/powershell /usr/local/share/chromium
        sudo docker system prune --all --force
        df -h /

    - name: Source checkout
      uses: actions/checkout@v6

    - name: Install host build tools
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake ninja-build flex bison ccache wget xz-utils tar python3-mako python3-yaml python3-packaging glslang-tools msitools

    - name: Install pinned Rust toolchain (amd64 LRM-RS default build)
      if: ${{ env.LRM_RS == 'ON' }}
      run: |
        TC=$(sed -n 's/^set(LIBERNT_RUST_TOOLCHAIN "\([^"]*\)".*/\1/p' sdk/cmake/rust.cmake)
        rustup toolchain install "$TC" --profile minimal --component llvm-tools --target x86_64-pc-windows-gnu
        rustc +"$TC" --version --verbose

    - name: Compute RosBE bootstrap SHA
      id: rosbe_spec
      run: |
        curl -fsSL https://raw.githubusercontent.com/LiberNT/libernt-build-toolchain/main/rosbe-unix-bootstrap.sh -o /tmp/rosbe-bootstrap.sh
        echo "sha=$(sha1sum /tmp/rosbe-bootstrap.sh | awk '{print $1}')" >> "$GITHUB_OUTPUT"

    - name: Cache RosBE
      id: cache_rosbe
      uses: actions/cache@v5
      with:
        path: ~/.local/opt/rosbe
        key: rosbe-${{runner.os}}-${{steps.rosbe_spec.outputs.sha}}

    - name: Install RosBE
      if: ${{ steps.cache_rosbe.outputs.cache-hit != 'true' }}
      run: sh /tmp/rosbe-bootstrap.sh

    - name: Restore ccache
      id: ccache_restore
      uses: actions/cache/restore@v5
      with:
        path: ccache
        key: ccache-${{matrix.compiler}}-${{matrix.arch}}${{matrix.variant}}-${{github.run_id}}-${{github.run_attempt}}
        restore-keys: |
          ccache-${{matrix.compiler}}-${{matrix.arch}}${{matrix.variant}}-

    - name: Set ccache settings
      run: |
        echo "CCACHE_BASEDIR=${{github.workspace}}" >> $GITHUB_ENV
        echo "CCACHE_DIR=${{github.workspace}}/ccache" >> $GITHUB_ENV
        echo "CCACHE_MAXSIZE=2G" >> $GITHUB_ENV
        echo "CCACHE_SLOPPINESS=time_macros" >> $GITHUB_ENV

    - name: Allocate the Leeway Build Identity
      id: lbi
      env:
        LBI_LEDGER_DEPLOY_KEY: ${{ secrets.LBI_LEDGER_DEPLOY_KEY }}
      run: |
        ENV_NAME=$([ "${{matrix.compiler}}" = "clang" ] && echo Clang || echo GCC)
        OUTDIR="output-$ENV_NAME-${{matrix.arch}}-debug"
        if [ "$LRM_RS" = ON ]; then
          echo "::notice::LBI: experimental LRM-RS image, no build identity is allocated"
          echo "require=OFF" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        if [ -z "$LBI_LEDGER_DEPLOY_KEY" ]; then
          echo "::notice::LBI: no ledger key in this context; the build stays unallocated"
          echo "require=OFF" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        mkdir -p ~/.ssh && chmod 700 ~/.ssh
        echo "$LBI_LEDGER_DEPLOY_KEY" > ~/.ssh/lbi_ledger && chmod 600 ~/.ssh/lbi_ledger
        ssh-keyscan -t ed25519 github.com >> ~/.ssh/known_hosts 2>/dev/null
        export GIT_SSH_COMMAND="ssh -i ~/.ssh/lbi_ledger -o IdentitiesOnly=yes"
        python3 -I sdk/tools/lbi/lbi_alloc.py --ledger git@github.com:LeewayOpenSoftware/leeway-lbi-ledger.git \
          --out "$OUTDIR" --source . --arch ${{matrix.arch}} --type chk --channel ldw_ci \
          --worker "gha-${{github.run_id}}-${{github.run_attempt}}"
        rm -f ~/.ssh/lbi_ledger
        echo "require=ON" >> "$GITHUB_OUTPUT"

    - name: Configure
      id: configure
      env:
        GITHUB_TOKEN: ${{ github.token }}
      run: |
        . "$HOME/.local/opt/rosbe/rosbe-env.sh"
        FLAGS=""
        [ "${{matrix.compiler}}" = "clang" ] && FLAGS="$FLAGS --clang"
        [ "${{matrix.compiler}}" = "gcc" ] && FLAGS="$FLAGS --gcc"
        [ -n "${{matrix.profile}}" ] && FLAGS="$FLAGS -DROSCONFIG_PROFILE=${{matrix.profile}}"
        [ "${{matrix.compiler}}" = "clang" ] && case "${{matrix.arch}}" in amd64) FLAGS="$FLAGS -DENABLE_MESA_LLVMPIPE=ON" ;; esac
        # LRM-RS special pool is the amd64 CMake default; only override it for an explicit flag-OFF control.
        [ "$LRM_RS" = OFF ] && FLAGS="$FLAGS -DLIBERNT_ENABLE_LRM_RS=OFF"
        # The lnrspoc PoC (ENABLE_RUST umbrella) is opt-in: build it for lab images only.
        [ "$LAB_POC" = ON ] && FLAGS="$FLAGS -DLIBERNT_ENABLE_RUST=ON"
        [ "$FORCE_PANIC" = ON ] && FLAGS="$FLAGS -DLIBERNT_LRM_RS_FORCE_PANIC_TEST=ON -DLNRSPOC_TEST_IOCTLS=ON"
        ./configure.sh $FLAGS -a ${{matrix.arch}} \
          -DREACTOS_TARGET_NT=0xA00 \
          -DDIAGDATA_CHANNEL= \
          -DLIBERNT_BUILD_UPDATE_PENDING=ON \
          -DENABLE_CCACHE=1 \
          -DLBI_REQUIRE_ALLOCATION=${{ steps.lbi.outputs.require || 'OFF' }}
        ENV_NAME=$([ "${{matrix.compiler}}" = "clang" ] && echo Clang || echo GCC)
        echo "outdir=output-$ENV_NAME-${{matrix.arch}}-debug" >> "$GITHUB_OUTPUT"

    - name: Build submodules
      run: |
        . "$HOME/.local/opt/rosbe/rosbe-env.sh"
        ninja -C ${{steps.configure.outputs.outdir}} submodules

    - name: Build images
      run: |
        . "$HOME/.local/opt/rosbe/rosbe-env.sh"
        ninja -C ${{steps.configure.outputs.outdir}} bootcd liberntimg liberntvhd -k0

    - name: Check the LRM-RS kernel exports (special pool routed through Rust)
      if: ${{ env.LRM_RS == 'ON' }}
      run: |
        . "$HOME/.local/opt/rosbe/rosbe-env.sh"
        OUT=${{steps.configure.outputs.outdir}}
        def=$(find "$OUT" -name 'ntoskrnl.def' -type f | head -n1)
        [ -n "$def" ] && grep -q LrmRsSelfTest "$def" || { echo "::error::ntoskrnl does not export LrmRsSelfTest"; exit 1; }
        if [ "$FORCE_PANIC" = ON ]; then grep -q LrmRsForcePanic "$def" || { echo "::error::force-panic image does not export LrmRsForcePanic"; exit 1; }; fi

    - name: Build lnrspoc PoC driver (lab image only)
      if: ${{ env.LAB_POC == 'ON' }}
      run: |
        . "$HOME/.local/opt/rosbe/rosbe-env.sh"
        OUT=${{steps.configure.outputs.outdir}}
        ninja -C "$OUT" lnrspoc
        mkdir -p lrmrs-out
        cp "$OUT/tools/rust-poc/lnrspoc.sys" "$OUT/tools/rust-poc/libleeway_rs_poc.a" "$OUT/ntoskrnl/liblrm_rs.a" lrmrs-out/
        (cd lrmrs-out && sha256sum * | tee SHA256SUMS)

    - name: Assert flag-OFF ntoskrnl has no LRM-RS exports (default build)
      if: ${{ env.LRM_RS == 'OFF' }}
      run: |
        . "$HOME/.local/opt/rosbe/rosbe-env.sh"
        OUT=${{steps.configure.outputs.outdir}}
        def=$(find "$OUT" -name 'ntoskrnl.def' -type f | head -n1)
        if [ -n "$def" ] && grep -qiE 'LrmRs' "$def"; then
          echo "::error::flag-OFF ntoskrnl.def exports an LrmRs symbol; export table must match a no-flag build"; grep -iE "LrmRs" "$def"; exit 1
        fi
        echo "flag-OFF export-table parity OK: no LrmRs exports in ${def:-<no ntoskrnl.def>}"

    - name: Build stage-1 applier
      run: |
        . "$HOME/.local/opt/rosbe/rosbe-env.sh"
        ninja -C ${{steps.configure.outputs.outdir}} LiberNTUpdatePending
        f=$(find ${{steps.configure.outputs.outdir}} -name LiberNTUpdatePending.exe | head -n1)
        mkdir -p applier-out && cp "$f" applier-out/
        (cd applier-out && sha256sum LiberNTUpdatePending.exe | tee LiberNTUpdatePending.exe.sha256 && wc -c < LiberNTUpdatePending.exe)

    - name: Print ccache statistics
      if: ${{ always() && steps.ccache_restore.outcome == 'success' }}
      run: ccache -s

    - name: Save ccache
      id: ccache_save
      if: ${{ always() && steps.ccache_restore.outcome == 'success' && env.LRM_RS != 'ON' }}
      uses: actions/cache/save@v5
      with:
        path: ccache
        key: ${{ steps.ccache_restore.outputs.cache-primary-key }}

    - name: Prune older ccache entries
      if: ${{ always() && steps.ccache_save.outcome == 'success' }}
      continue-on-error: true
      env:
        GH_TOKEN: ${{ github.token }}
        CACHE_KEY_PREFIX: ccache-${{matrix.compiler}}-${{matrix.arch}}${{matrix.variant}}-
        CACHE_KEY_KEEP: ${{ steps.ccache_restore.outputs.cache-primary-key }}
      run: |
        gh cache list --repo "$GITHUB_REPOSITORY" --ref "$GITHUB_REF" --key "$CACHE_KEY_PREFIX" --limit 100 --json id,key \
          --jq '.[] | select(.key != env.CACHE_KEY_KEEP) | .id' |
        while read -r id; do
          gh cache delete "$id" --repo "$GITHUB_REPOSITORY" || true
        done

    - name: Name artifacts
      id: images
      run: |
        V=""
        [ "$LAB_POC" = ON ] && V="-lrmrs"
        [ "$LRM_RS" = OFF ] && V="-lrmoff"
        [ "$FORCE_PANIC" = ON ] && V="-lrmrs-fp"
        echo "tag=${{matrix.compiler}}-${{matrix.arch}}${{matrix.variant}}$V-${GITHUB_SHA::11}" >> "$GITHUB_OUTPUT"

    - name: Upload lnrspoc.sys and the Rust archives (lab image only)
      if: ${{ env.LAB_POC == 'ON' }}
      uses: actions/upload-artifact@v7
      with:
        name: lnrspoc-lrmrs-${{steps.images.outputs.tag}}
        path: lrmrs-out/
        if-no-files-found: error

    - name: Upload stage-1 applier
      uses: actions/upload-artifact@v7
      with:
        name: libernt-update-pending-${{steps.images.outputs.tag}}
        path: applier-out/

    - name: Upload bootcd.iso
      uses: actions/upload-artifact@v7
      with:
        name: bootcd-iso-${{steps.images.outputs.tag}}
        path: ${{steps.configure.outputs.outdir}}/bootcd.iso

    - name: Upload LiberNT.img
      uses: actions/upload-artifact@v7
      with:
        name: LiberNT-img-${{steps.images.outputs.tag}}
        path: ${{steps.configure.outputs.outdir}}/LiberNT.img

    - name: Upload LiberNT.vhd
      uses: actions/upload-artifact@v7
      with:
        name: LiberNT-vhd-${{steps.images.outputs.tag}}
        path: ${{steps.configure.outputs.outdir}}/LiberNT.vhd

    - name: Upload LiberNT.vhdx
      uses: actions/upload-artifact@v7
      with:
        name: LiberNT-vhdx-${{steps.images.outputs.tag}}
        path: ${{steps.configure.outputs.outdir}}/LiberNT.vhdx

    - name: Check build dependencies
      run: python3 sdk/tools/depcheck.py ${{steps.configure.outputs.outdir}} --mode depfiles --nested --fail-on-gaps

    - name: Check export loops
      timeout-minutes: 10
      run: python3 -u sdk/tools/check-forwarder-loops.py ${{steps.configure.outputs.outdir}}

    - name: Check the FreeLoader size
      # The PC loader stops itself at boot when its PE exceeds MAX_FREELDR_PE_SIZE.
      run: python3 -u sdk/tools/check-freeldr-size.py ${{steps.configure.outputs.outdir}}

  build-rostests:
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.lrm_rs == 'on') }}
    # Compile the test suite (modules/rostests) with clang for amd64. A
    # separate build, because ENABLE_ROSTESTS also changes what goes into
    # the images that build-linux produces. Compile only, no test run.
    runs-on: ubuntu-24.04
    steps:
    - name: Free disk space
      run: |
        sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/share/swift /usr/lib/jvm /usr/local/share/powershell /usr/local/share/chromium
        df -h /

    - name: Source checkout
      uses: actions/checkout@v6

    - name: Install host build tools
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake ninja-build flex bison ccache wget xz-utils tar python3-mako python3-yaml python3-packaging glslang-tools msitools

    - name: Install pinned Rust toolchain (full-tree configure, LRM-RS default ON on amd64)
      run: |
        TC=$(sed -n 's/^set(LIBERNT_RUST_TOOLCHAIN "\([^"]*\)".*/\1/p' sdk/cmake/rust.cmake)
        rustup toolchain install "$TC" --profile minimal --component llvm-tools --target x86_64-pc-windows-gnu
        rustc +"$TC" --version --verbose

    - name: Compute RosBE bootstrap SHA
      id: rosbe_spec
      run: |
        curl -fsSL https://raw.githubusercontent.com/LiberNT/libernt-build-toolchain/main/rosbe-unix-bootstrap.sh -o /tmp/rosbe-bootstrap.sh
        echo "sha=$(sha1sum /tmp/rosbe-bootstrap.sh | awk '{print $1}')" >> "$GITHUB_OUTPUT"

    - name: Cache RosBE
      id: cache_rosbe
      uses: actions/cache@v5
      with:
        path: ~/.local/opt/rosbe
        key: rosbe-${{runner.os}}-${{steps.rosbe_spec.outputs.sha}}

    - name: Install RosBE
      if: ${{ steps.cache_rosbe.outputs.cache-hit != 'true' }}
      run: sh /tmp/rosbe-bootstrap.sh

    - name: Restore ccache
      id: ccache_restore
      uses: actions/cache/restore@v5
      with:
        path: ccache
        key: ccache-clang-amd64-rostests-${{github.run_id}}-${{github.run_attempt}}
        restore-keys: |
          ccache-clang-amd64-rostests-
          ccache-clang-amd64-

    - name: Set ccache settings
      run: |
        echo "CCACHE_BASEDIR=${{github.workspace}}" >> $GITHUB_ENV
        echo "CCACHE_DIR=${{github.workspace}}/ccache" >> $GITHUB_ENV
        echo "CCACHE_MAXSIZE=1G" >> $GITHUB_ENV
        echo "CCACHE_SLOPPINESS=time_macros" >> $GITHUB_ENV

    - name: Configure
      id: configure
      run: |
        . "$HOME/.local/opt/rosbe/rosbe-env.sh"
        ./configure.sh --clang -a amd64 \
          -DREACTOS_TARGET_NT=0xA00 \
          -DDIAGDATA_CHANNEL= \
          -DENABLE_ROSTESTS=1 \
          -DENABLE_CCACHE=1
        echo "outdir=output-Clang-amd64-debug" >> "$GITHUB_OUTPUT"

    - name: Build the test suite
      run: |
        . "$HOME/.local/opt/rosbe/rosbe-env.sh"
        OUT=${{steps.configure.outputs.outdir}}
        # The per-directory target of the Ninja generator; without it, build everything.
        if ninja -C "$OUT" -t targets all | grep -q "^modules/rostests/all:"; then
          ninja -C "$OUT" -k0 modules/rostests/all
        else
          ninja -C "$OUT" -k0
        fi

    - name: Collect the kmtests binaries
      # kmtest.exe + kmtest_drv.sys (and the standalone test drivers) for a lab
      # run against the LiberNT.img of the same commit; the images themselves
      # are built without ENABLE_ROSTESTS and carry no kmtest.
      run: |
        OUT=${{steps.configure.outputs.outdir}}
        mkdir -p kmtests-out
        find "$OUT/modules/rostests/kmtests" -type f \( -name '*.exe' -o -name '*.sys' -o -name '*.dll' -o -name '*.inf' \) -exec cp -v {} kmtests-out/ \;
        ls -l kmtests-out

    - name: Upload the kmtests binaries
      uses: actions/upload-artifact@v7
      with:
        name: kmtests-clang-amd64-${{github.sha}}
        path: kmtests-out/
        if-no-files-found: error

    - name: Collect the apitests binaries
      # Every *_apitest.exe, native amd64 and the WoW64 i386 build, for a lab run
      # against the LiberNT.img of the same commit; the images carry no apitest.
      run: |
        OUT=${{steps.configure.outputs.outdir}}
        mkdir -p apitests-out/amd64 apitests-out/wow64
        find "$OUT/modules/rostests/apitests" -type f -name '*_apitest.exe' -exec cp -v {} apitests-out/amd64/ \;
        if [ -d "$OUT/_wow64_i386/modules/rostests/apitests" ]; then
          find "$OUT/_wow64_i386/modules/rostests/apitests" -type f -name '*_apitest.exe' -exec cp -v {} apitests-out/wow64/ \;
        fi
        find "$OUT/modules/rostests/tests" -type f \( -name 'lowil.exe' -o -name 'elevadm.exe' \) -exec cp -v {} apitests-out/amd64/ \;
        if [ -d "$OUT/_wow64_i386/modules/rostests/tests" ]; then
          find "$OUT/_wow64_i386/modules/rostests/tests" -type f \( -name 'lowil.exe' -o -name 'elevadm.exe' \) -exec cp -v {} apitests-out/wow64/ \;
        fi
        ls -lR apitests-out | head -100

    - name: Upload the apitests binaries
      uses: actions/upload-artifact@v7
      with:
        name: apitests-clang-amd64-${{github.sha}}
        path: apitests-out/
        if-no-files-found: error

    - name: Save ccache
      if: ${{ always() && steps.ccache_restore.outcome == 'success' }}
      uses: actions/cache/save@v5
      with:
        path: ccache
        key: ${{ steps.ccache_restore.outputs.cache-primary-key }}

  ntfslib-host-tests:
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.lrm_rs == 'on') }}
    # The host tests of the NTFS library, outside the image build: the
    # volume check (index walk unit test, cluster claim smoke test), a
    # directory index that grows past its base record, a size change made
    # with the automatic timestamps masked (the cleanup-time persist), and
    # the shape verifier, which also runs after every change here. Built
    # under ASan and UBSan with the library's asserts live.
    runs-on: ubuntu-24.04
    steps:
    - name: Source checkout
      uses: actions/checkout@v6
      with:
        sparse-checkout: |
          sdk/lib/fslib/ntfslib_new
          base/applications/cmdutils/lntexpandstorage

    - name: Install host build tools
      run: |
        sudo apt-get update
        sudo apt-get install -y g++ cmake ninja-build pkg-config libfuse3-dev ntfs-3g

    - name: Configure
      run: |
        # Shape invariants after each change, as in a checked build.
        cmake -S sdk/lib/fslib/ntfslib_new/linux -B build/ntfslib-linux -G Ninja -DCMAKE_BUILD_TYPE=Debug -DNTFSLIB_SANITIZE=ON -DNTFSLIB_VERIFY_SHAPE=ON

    - name: Build
      run: |
        cmake --build build/ntfslib-linux --target ntfslib_check_split_trim_test ntfslib_size_persist_times_test ntfslib_lookup_index_cache_test ntfslib_mft_mirror_fallback_test ntfslib_corrupt_runlist_dirty_test ntfslib_lost_write_dirty_test ntfslib_fuse

    - name: Run the host tests
      env:
        ASAN_OPTIONS: detect_leaks=1:abort_on_error=1
        UBSAN_OPTIONS: print_stacktrace=1
        NTFSLIB_KEEP_FAILED: ${{ runner.temp }}/ntfslib-failed
      run: |
        ctest --test-dir build/ntfslib-linux --output-on-failure -R "check_split_trim|check_claim|grow_fragmented_index|size_persist_times|verify_shape|check_attrlist|data_mapping_spill|check_shape|index_spill|crash_consistency|lookup_index_cache|mft_mirror_fallback|corrupt_runlist_dirty|lost_write_dirty|full_base_growth"

    - name: Upload the images of failed host tests
      if: ${{ failure() }}
      uses: actions/upload-artifact@v7
      with:
        name: ntfslib-failed-images
        path: ${{ runner.temp }}/ntfslib-failed
        if-no-files-found: ignore

  cmlib-host-tests:
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.lrm_rs == 'on') }}
    # Host test of the configuration-manager hive library: HvMarkCellDirty must
    # mark every block a cell occupies, including a block-aligned header and a
    # cell that spans several blocks. Regression for the dx2400 STOP 0x1E at
    # cmapi.c:1015 (CmDeleteValueKey). Built under ASan and UBSan.
    runs-on: ubuntu-24.04
    steps:
    - name: Source checkout
      uses: actions/checkout@v6
      with:
        sparse-checkout: |
          sdk/lib/cmlib
          sdk/lib/rtl
          sdk/include
          submodules/host-tests/cmlib

    - name: Install host build tools
      run: |
        sudo apt-get update
        sudo apt-get install -y gcc cmake ninja-build

    - name: Configure
      run: |
        cmake -S submodules/host-tests/cmlib -B build/cmlib-host -G Ninja -DCMAKE_BUILD_TYPE=Debug -DCMLIB_SANITIZE=ON

    - name: Build
      run: |
        cmake --build build/cmlib-host

    - name: Run the host tests
      env:
        ASAN_OPTIONS: detect_leaks=1:abort_on_error=1
        UBSAN_OPTIONS: print_stacktrace=1
      run: |
        ctest --test-dir build/cmlib-host --output-on-failure -R "cmlib_mark_dirty|cmlib_dirty_arith"

  mmcc-host-tests:
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.lrm_rs == 'on') }}
    # Host tests of the NVS memory manager core on a simulated machine: page
    # tables, faults, sections, the cache manager on top, system regions and
    # the guarded special pool region, for amd64, arm64 and high memory, plus
    # ASan/UBSan and TSan builds of the light test set.
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
    - name: Source checkout
      uses: actions/checkout@v6
      with:
        sparse-checkout: |
          ntoskrnl
          sdk/include
          subsystems/linux/lxcore
          submodules/host-tests

    - name: Install host build tools
      run: |
        sudo apt-get update
        sudo apt-get install -y gcc cmake ninja-build

    - name: Configure
      run: |
        cmake -S submodules/host-tests/mmcc/nvs/core -B build/mmcc-host -G Ninja -DCMAKE_BUILD_TYPE=Debug

    - name: Build
      run: |
        cmake --build build/mmcc-host

    - name: Run the host tests
      env:
        ASAN_OPTIONS: detect_leaks=1:abort_on_error=1
        UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        TSAN_OPTIONS: halt_on_error=1
      run: |
        ctest --test-dir build/mmcc-host --output-on-failure -j 4

  build-msvc:
    # MSVC + Rust is a required configuration (owner order 2026-11-14). The lrmrs leg is the primary one;
    # the conly leg (LRM-RS OFF, no Rust toolchain installed) only shows that the C-only build still works.
    # Runs on leeway/main, on the ci/msvc-rust* work branches and on a manual run with msvc=true.
    if: ${{ github.ref == 'refs/heads/leeway/main' || startsWith(github.ref, 'refs/heads/ci/msvc-rust') || (github.event_name == 'workflow_dispatch' && inputs.msvc) }}
    strategy:
      matrix:
        include:
          - arch: amd64
            lrm_rs: 'ON'
            variant: lrmrs
            rust_target: x86_64-pc-windows-msvc
          - arch: amd64
            lrm_rs: 'OFF'
            variant: conly
          - arch: i386
            lrm_rs: 'ON'
            variant: lrmrs
            rust_target: i686-pc-windows-msvc
          - arch: i386
            lrm_rs: 'OFF'
            variant: conly
      fail-fast: false
    runs-on: windows-2025
    steps:
    - name: Source checkout
      uses: actions/checkout@v6

    - name: Install host build tools
      shell: pwsh
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        # GitHub throttles anonymous release downloads from runners; gh downloads with the job token.
        $zip = "$env:RUNNER_TEMP\win_flex_bison-2.5.24.zip"
        foreach ($attempt in 1..4) {
            gh release download v2.5.24 --repo lexxmark/winflexbison --pattern win_flex_bison-2.5.24.zip --output $zip --clobber
            if ($LASTEXITCODE -eq 0) { break }
            if ($attempt -eq 4) { throw "Downloading winflexbison failed" }
            Start-Sleep -Seconds (15 * $attempt)
        }
        if ((Get-FileHash $zip -Algorithm SHA256).Hash -ne "39C6086CE211D5415500ACC5ED2D8939861CA1696AEE48909C7F6DAF5122B505") {
            throw "win_flex_bison-2.5.24.zip does not have the expected SHA256"
        }
        $tools = "$env:RUNNER_TEMP\winflexbison"
        Expand-Archive $zip -DestinationPath $tools -Force
        python -m pip install --upgrade mako pyyaml packaging
        # LiberNT's CMake looks for flex/bison; winflexbison ships them as
        # win_flex/win_bison, so expose both names on PATH.
        Copy-Item "$tools\win_flex.exe" "$tools\flex.exe" -Force
        Copy-Item "$tools\win_bison.exe" "$tools\bison.exe" -Force
        echo "$tools" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

    - name: Install pinned Rust toolchain (MSVC target of the leg)
      if: ${{ matrix.lrm_rs == 'ON' }}
      shell: pwsh
      run: |
        $m = Select-String -Path sdk/cmake/rust.cmake -Pattern '^set\(LIBERNT_RUST_TOOLCHAIN "([^"]+)"'
        if (-not $m) { throw "sdk/cmake/rust.cmake has no LIBERNT_RUST_TOOLCHAIN pin" }
        $tc = $m.Matches[0].Groups[1].Value
        rustup toolchain install $tc --profile minimal --component llvm-tools --target ${{matrix.rust_target}}
        if ($LASTEXITCODE -ne 0) { throw "rustup could not install Rust $tc" }
        $vv = rustup run $tc rustc --version --verbose
        if ($LASTEXITCODE -ne 0) { throw "Rust $tc does not run" }
        $vv
        if (-not ($vv | Select-String -SimpleMatch 'host: x86_64-pc-windows-msvc')) {
            throw "Rust $tc is not the x86_64-pc-windows-msvc host toolchain"
        }
        $libdir = rustup run $tc rustc --print target-libdir --target ${{matrix.rust_target}}
        if (-not (Get-ChildItem "$libdir/libcore-*.rlib" -ErrorAction SilentlyContinue)) {
            throw "Rust $tc has no core library for ${{matrix.rust_target}}"
        }

    - name: Set up the MSVC build environment
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: ${{ matrix.arch == 'i386' && 'amd64_x86' || matrix.arch == 'arm64' && 'amd64_arm64' || 'amd64' }}

    - name: Configure
      id: configure
      shell: cmd
      env:
        GITHUB_TOKEN: ${{ github.token }}
      run: |
        :: LRM-RS is set explicitly in both legs, so a leg can never fall back to the other configuration.
        set RUST_ARGS=
        if "${{matrix.lrm_rs}}"=="ON" set RUST_ARGS=-DLIBERNT_RUST_TARGET=${{matrix.rust_target}}
        call configure.cmd /arch=${{matrix.arch}} -DREACTOS_TARGET_NT=0xA00 -DDIAGDATA_CHANNEL= -DENABLE_CCACHE=0 -DLIBERNT_ENABLE_LRM_RS=${{matrix.lrm_rs}} %RUST_ARGS%
        echo outdir=output-VS-${{matrix.arch}}-debug>> "%GITHUB_OUTPUT%"

    - name: Build submodules
      shell: cmd
      run: ninja -C ${{steps.configure.outputs.outdir}} submodules

    - name: Build
      shell: cmd
      run: ninja -C ${{steps.configure.outputs.outdir}} -k0

    - name: Check the LRM-RS exports of the linked kernel
      if: ${{ !cancelled() && steps.configure.outcome == 'success' }}
      shell: pwsh
      run: |
        $k = "${{steps.configure.outputs.outdir}}/ntoskrnl/ntoskrnl.exe"
        if (-not (Test-Path $k)) { throw "ntoskrnl.exe was not linked" }
        $exports = dumpbin /nologo /exports $k
        if ($LASTEXITCODE -ne 0) { throw "dumpbin could not read ntoskrnl.exe" }
        $hits = $exports | Select-String -SimpleMatch 'LrmRs'
        if ('${{matrix.lrm_rs}}' -eq 'ON') {
            if (-not ($exports | Select-String -SimpleMatch 'LrmRsSelfTest')) {
                throw "ntoskrnl.exe was built with LRM-RS ON but does not export LrmRsSelfTest"
            }
            $hits
        } elseif ($hits) {
            $hits
            throw "The C-only ntoskrnl.exe exports an LrmRs symbol"
        } else {
            "C-only ntoskrnl.exe has no LrmRs exports"
        }

    - name: Build bootcd.iso
      id: bootcd
      if: ${{ !cancelled() && steps.configure.outcome == 'success' }}
      shell: cmd
      run: ninja -C ${{steps.configure.outputs.outdir}} bootcd -k0

    - name: Name artifacts
      id: images
      if: ${{ !cancelled() && steps.configure.outcome == 'success' }}
      shell: pwsh
      run: |
        "tag=msvc-${{matrix.arch}}-${{matrix.variant}}-$($env:GITHUB_SHA.Substring(0, 11))" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

    - name: Upload bootcd.iso
      if: ${{ !cancelled() && steps.bootcd.outcome == 'success' }}
      uses: actions/upload-artifact@v7
      with:
        name: bootcd-iso-${{steps.images.outputs.tag}}
        path: ${{steps.configure.outputs.outdir}}/bootcd.iso
        if-no-files-found: error

    - name: Upload the kernel and the Rust library (for the ABI review)
      if: ${{ !cancelled() && steps.configure.outcome == 'success' }}
      uses: actions/upload-artifact@v7
      with:
        name: ntoskrnl-${{steps.images.outputs.tag}}
        path: |
          ${{steps.configure.outputs.outdir}}/ntoskrnl/ntoskrnl.exe
          ${{steps.configure.outputs.outdir}}/ntoskrnl/ntoskrnl.map
          ${{steps.configure.outputs.outdir}}/ntoskrnl/**/ntoskrnl.pdb
          ${{steps.configure.outputs.outdir}}/ntoskrnl/**/lrm_rs*.lib
          ${{steps.configure.outputs.outdir}}/ntoskrnl/**/liblrm_rs*.a
        if-no-files-found: warn
