# Test-only build of the experimental Rust kernel driver lnrspoc.sys (+ symbols) and, for the
# LRM-RS flag-ON leg, of ntoskrnl with the Rust special pool linked in.
#
# Runs ONLY on leeway/exp-rust-poc and leeway/exp-lrm-rs-kernel (and manual dispatch). It does NOT
# touch the main build matrix or any main workflow. Two legs:
#   - lrmrs=off: LIBERNT_ENABLE_RUST=ON, LRM-RS OFF (default). Builds lnrspoc; proves the driver and
#     the default (flag-OFF) special-pool path still build and the ntoskrnl export table is
#     unchanged. Publishes the TEST-ONLY driver artifact for a disposable-VM run.
#   - lrmrs=on: + LIBERNT_ENABLE_LRM_RS=ON. Builds ntoskrnl (lrm_rs linked, MmAllocate/FreeSpecialPool
#     routed through Rust, lrmrs.c self-test compiled) AND lnrspoc, and checks the conditional
#     LrmRsSelfTest export is present. This is the flag-ON compile+link gate.
# The driver is never placed on installation media (no add_cd_file).
name: lnrspoc-driver (test-only)

on:
  push:
    branches: [leeway/exp-rust-poc, leeway/exp-lrm-rs-kernel]
    paths:
      - 'tools/rust-poc/**'
      - 'sdk/cmake/rust.cmake'
      - 'sdk/cmake/rust-build.cmake'
      - 'ntoskrnl/nvs/nt/ntspecial.c'
      - 'ntoskrnl/nvs/nt/lrmrs.c'
      - 'ntoskrnl/nvs/include/lrmrs.h'
      - 'ntoskrnl/CMakeLists.txt'
      - '.github/workflows/lnrspoc-driver.yml'
  workflow_dispatch:

concurrency:
  group: lnrspoc-driver-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lnrspoc:
    # Guard: never run on any other branch even if the file reaches one.
    if: ${{ github.ref == 'refs/heads/leeway/exp-rust-poc' || github.ref == 'refs/heads/leeway/exp-lrm-rs-kernel' }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        lrmrs: [off, on]
    name: lnrspoc (lrmrs=${{ matrix.lrmrs }})
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/share/swift /usr/lib/jvm /usr/local/share/powershell /usr/local/share/chromium
          sudo docker system prune --all --force
          df -h /

      - name: Source checkout
        uses: actions/checkout@v6

      - name: Install host build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build flex bison ccache wget xz-utils tar python3-mako python3-yaml python3-packaging glslang-tools msitools

      - name: Install pinned Rust toolchain (for the Rust staticlibs)
        run: |
          TC=$(sed -n 's/^set(LIBERNT_RUST_TOOLCHAIN "\([^"]*\)".*/\1/p' sdk/cmake/rust.cmake)
          rustup toolchain install "$TC" --profile minimal \
            --component llvm-tools --target x86_64-pc-windows-gnu
          rustc +"$TC" --version --verbose

      - name: Compute RosBE bootstrap SHA
        id: rosbe_spec
        run: |
          curl -fsSL https://raw.githubusercontent.com/LiberNT/libernt-build-toolchain/main/rosbe-unix-bootstrap.sh -o /tmp/rosbe-bootstrap.sh
          echo "sha=$(sha1sum /tmp/rosbe-bootstrap.sh | awk '{print $1}')" >> "$GITHUB_OUTPUT"

      - name: Cache RosBE
        id: cache_rosbe
        uses: actions/cache@v5
        with:
          path: ~/.local/opt/rosbe
          key: rosbe-${{runner.os}}-${{steps.rosbe_spec.outputs.sha}}

      - name: Install RosBE
        if: ${{ steps.cache_rosbe.outputs.cache-hit != 'true' }}
        run: sh /tmp/rosbe-bootstrap.sh

      - name: Configure (Rust PoC enabled, test IOCTL on; LRM-RS per leg)
        id: configure
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          . "$HOME/.local/opt/rosbe/rosbe-env.sh"
          EXTRA=
          if [ "${{ matrix.lrmrs }}" = "on" ]; then EXTRA="-DLIBERNT_ENABLE_LRM_RS=ON"; fi
          ./configure.sh --clang -a amd64 \
            -DREACTOS_TARGET_NT=0xA00 \
            -DDIAGDATA_CHANNEL= \
            -DLIBERNT_ENABLE_RUST=ON \
            -DLNRSPOC_TEST_IOCTLS=ON \
            $EXTRA
          echo "outdir=output-Clang-amd64-debug" >> "$GITHUB_OUTPUT"

      - name: Build submodules (headers/import libs)
        run: |
          . "$HOME/.local/opt/rosbe/rosbe-env.sh"
          ninja -C ${{steps.configure.outputs.outdir}} submodules

      - name: Build (flag ON -> ntoskrnl + lnrspoc; flag OFF -> lnrspoc)
        run: |
          . "$HOME/.local/opt/rosbe/rosbe-env.sh"
          if [ "${{ matrix.lrmrs }}" = "on" ]; then
            ninja -C ${{steps.configure.outputs.outdir}} ntoskrnl lnrspoc
          else
            ninja -C ${{steps.configure.outputs.outdir}} lnrspoc
          fi

      - name: Verify conditional LrmRsSelfTest export (flag ON)
        if: ${{ matrix.lrmrs == 'on' }}
        run: |
          OUT=${{steps.configure.outputs.outdir}}
          def=$(find "$OUT" -name 'ntoskrnl.def' -type f | head -n1)
          [ -n "$def" ] || { echo "::error::ntoskrnl.def not found"; exit 1; }
          grep -q "LrmRsSelfTest" "$def" || { echo "::error::LrmRsSelfTest missing from the flag-ON export def"; exit 1; }
          echo "LrmRsSelfTest present in $def"

      - name: Assert default export table unchanged (flag OFF)
        if: ${{ matrix.lrmrs == 'off' }}
        run: |
          OUT=${{steps.configure.outputs.outdir}}
          def=$(find "$OUT" -name 'ntoskrnl.def' -type f | head -n1)
          if [ -n "$def" ] && grep -q "LrmRsSelfTest" "$def"; then
            echo "::error::LrmRsSelfTest leaked into the default (flag-OFF) export table"; exit 1
          fi
          echo "default export table clean"

      - name: Collect driver + symbols + sha256
        id: collect
        run: |
          OUT=${{steps.configure.outputs.outdir}}
          mkdir -p lnrspoc-test-only
          found=0
          for pat in 'lnrspoc.sys' 'lnrspoc.pdb' 'lnrspoc.map' 'lnrspoc.dbg'; do
            f=$(find "$OUT" -name "$pat" -type f | head -n1)
            if [ -n "$f" ]; then cp "$f" lnrspoc-test-only/; found=1; fi
          done
          # The Rust archives the build linked (add_rust_staticlib outputs, fixed paths).
          rlib="$OUT/tools/rust-poc/libleeway_rs_poc.a"
          cp "$rlib" lnrspoc-test-only/ || { echo "::error::$rlib (linked into lnrspoc) is missing"; exit 1; }
          if [ "${{ matrix.lrmrs }}" = "on" ]; then
            klib="$OUT/ntoskrnl/liblrm_rs.a"
            cp "$klib" lnrspoc-test-only/ || { echo "::error::$klib (linked into ntoskrnl) is missing"; exit 1; }
          fi
          if [ "$found" != 1 ]; then echo "::error::lnrspoc.sys not produced"; find "$OUT" -iname 'lnrspoc*'; exit 1; fi
          ( cd lnrspoc-test-only && for x in *; do sha256sum "$x" | tee "$x.sha256"; done )
          echo "=== collected ==="; ls -l lnrspoc-test-only
          echo "tag=clang-amd64-lrmrs-${{ matrix.lrmrs }}-${GITHUB_SHA::11}" >> "$GITHUB_OUTPUT"

      - name: Upload test-only artifact
        uses: actions/upload-artifact@v7
        with:
          name: lnrspoc-test-only-${{steps.collect.outputs.tag}}
          path: lnrspoc-test-only
          if-no-files-found: error
