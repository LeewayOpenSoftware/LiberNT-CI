# no_std freestanding kernel-mode staticlib: rebuild core + compiler_builtins for our custom target.
[unstable]
build-std = ["core", "compiler_builtins"]
build-std-features = ["compiler-builtins-mem"]
json-target-spec = true

[build]
target = "targets/x86_64-unknown-libernt-kernel.json"
# v0 mangling so KD/WinDbg can demangle internal Rust frames.
rustflags = ["-Csymbol-mangling-version=v0"]
